<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-dark text-light" data-bs-theme="dark">

  <!-- Navegación y Búsqueda -->
  <nav class="navbar navbar-expand-lg bg-danger navbar-dark sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#" id="brand-reset">
        Pokédex
      </a>
      <form class="d-flex" id="search-form" role="search">
        <div class="input-group">
          <input class="form-control" type="search" id="search-input" placeholder="Buscar por nombre o ID..." aria-label="Search">
          <button class="btn btn-dark" type="submit">Buscar</button>
          <button class="btn btn-outline-light d-none" type="button" id="clear-search-btn">Reset</button>
        </div>
      </form>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Indicador de Carga -->
    <div id="loading-spinner" class="text-center my-5 d-none">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2 text-secondary">Consultando Servidor Express...</p>
    </div>

    <!-- Pantalla de Error -->
    <div id="error-view" class="alert alert-danger text-center my-4 d-none" role="alert">
      <h4 class="alert-heading fw-bold">¡Pokémon No Encontrado!</h4>
      <p id="error-message">Este Pokémon no existe en la base de datos.</p>
      <hr>
      <button class="btn btn-outline-light" id="error-reset-btn">Regresar al Inicio</button>
    </div>

    <!-- Tarjeta Principal del Pokémon -->
    <section id="catalog-section" class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card bg-secondary-subtle border-0 shadow-lg text-light">
          
          <!-- Encabezado -->
          <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center py-3">
            <h3 class="card-title fw-bold text-capitalize mb-0" id="pokemon-name">Cargando...</h3>
            <span class="badge bg-dark fs-6" id="pokemon-id">#000</span>
          </div>

          <div class="card-body p-4">
            <div class="text-center mb-4">
              <!-- Imagen -->
              <div class="p-3 rounded bg-dark border border-secondary d-inline-block mb-3">
                <img id="pokemon-img" src="" alt="Sprite de Pokémon" class="img-fluid" style="max-height: 200px;">
              </div>
              <!-- Tipos -->
              <div id="pokemon-types" class="d-flex justify-content-center gap-2 flex-wrap"></div>
            </div>

            <!-- Atributos Principales -->
            <div class="row g-2 text-center mb-3">
              <div class="col-4">
                <div class="p-2 border rounded bg-dark">
                  <small class="text-secondary d-block">Experiencia</small>
                  <span class="fw-bold" id="pokemon-exp">-</span>
                </div>
              </div>
              <div class="col-4">
                <div class="p-2 border rounded bg-dark">
                  <small class="text-secondary d-block">Peso</small>
                  <span class="fw-bold" id="pokemon-weight">-</span>
                </div>
              </div>
              <div class="col-4">
                <div class="p-2 border rounded bg-dark">
                  <small class="text-secondary d-block">Altura</small>
                  <span class="fw-bold" id="pokemon-height">-</span>
                </div>
              </div>
            </div>

            <!-- Habilidades -->
            <div class="mb-3">
              <h6 class="fw-bold text-secondary mb-1">Habilidades</h6>
              <div id="pokemon-abilities" class="d-flex flex-wrap gap-1"></div>
            </div>

            <!-- Movimientos -->
            <div>
              <h6 class="fw-bold text-secondary mb-1">Movimientos</h6>
              <div id="pokemon-moves" class="p-2 border rounded bg-dark d-flex flex-wrap gap-1" style="max-height: 120px; overflow-y: auto;"></div>
            </div>
          </div>

          <!-- Botones de Navegación Cíclica -->
          <div class="card-footer bg-dark d-flex justify-content-between align-items-center py-3">
            <button type="button" class="btn btn-outline-light px-4" id="prev-btn">
              &larr; Anterior
            </button>
            <span class="text-secondary small d-none d-sm-inline">Usa Flechas Izq / Der</span>
            <button type="button" class="btn btn-outline-light px-4" id="next-btn">
              Siguiente &rarr;
            </button>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
